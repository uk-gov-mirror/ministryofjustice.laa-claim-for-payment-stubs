ext {
    logbackVersion = '1.5.36'
    checkstyleVersion = '11.0.0'
    jacksonDatabindVersion = '3.1.5'
}

subprojects {
    group = 'uk.gov.justice.laa.claimforpayment.stubs.civilclaimsapi.stubs'

    configurations.configureEach {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'

        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'ch.qos.logback' && details.requested.name in ['logback-classic', 'logback-core']) {
                details.useVersion rootProject.ext.logbackVersion
                details.because('Align Logback across subprojects to avoid vulnerable versions')
            }
            if (details.requested.group == 'com.puppycrawl.tools' && details.requested.name == 'checkstyle') {
                details.useVersion rootProject.ext.checkstyleVersion
                details.because('Align Checkstyle across subprojects to avoid vulnerable versions')
            }
            if (details.requested.group == 'tools.jackson.core' && details.requested.name == 'jackson-databind') {
                details.useVersion rootProject.ext.jacksonDatabindVersion
                details.because('Align Jackson databind across subprojects to resolve Snyk vulnerabilities')
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy.force(
            "ch.qos.logback:logback-classic:${rootProject.ext.logbackVersion}",
            "ch.qos.logback:logback-core:${rootProject.ext.logbackVersion}",
            "com.puppycrawl.tools:checkstyle:${rootProject.ext.checkstyleVersion}",
            "tools.jackson.core:jackson-databind:${rootProject.ext.jacksonDatabindVersion}"
        )
    }

    configurations.matching { it.name == 'checkstyle' }.configureEach {
        resolutionStrategy.force("com.puppycrawl.tools:checkstyle:${rootProject.ext.checkstyleVersion}")
    }

    plugins.withType(JavaPlugin) {
        dependencies {
            runtimeOnly("ch.qos.logback:logback-classic:${rootProject.ext.logbackVersion}")
            runtimeOnly("ch.qos.logback:logback-core:${rootProject.ext.logbackVersion}")
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }

}
